<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Cricket - CRICMASTER</title>

    <link rel="stylesheet" href="/css/reset.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #17202a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-inner {
            max-width: 1150px;
            margin: auto;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .brand span {
            font-size: 13px;
            display: block;
            color: #6b7280;
            margin-top: 2px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background: #e53935;
            border-radius: 50%;
        }

        .page {
            max-width: 1150px;
            margin: auto;
            padding: 24px 20px 40px;
        }

        .hero {
            margin-bottom: 22px;
        }

        .hero h1 {
            margin: 0;
            font-size: 30px;
        }

        .hero p {
            margin: 7px 0 0;
            color: #6b7280;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toolbar a,
        .refresh-btn {
            padding: 10px 15px;
            border-radius: 9px;
            border: 1px solid #dfe3e8;
            background: #ffffff;
            text-decoration: none;
            color: #17202a;
            font-weight: 600;
            cursor: pointer;
        }

        .refresh-btn:hover,
        .toolbar a:hover {
            background: #f0f2f4;
        }

        #status {
            margin-bottom: 16px;
            color: #68707a;
            font-size: 14px;
        }

        .match-list {
            display: grid;
            gap: 18px;
        }

        .match-card {
            background: #ffffff;
            border: 1px solid #e7eaee;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }

        .match-header {
            padding: 14px 18px;
            border-bottom: 1px solid #edf0f2;
        }

        .match-name {
            font-size: 17px;
            font-weight: 800;
        }

        .match-meta {
            margin-top: 6px;
            color: #747b84;
            font-size: 13px;
        }

        .match-body {
            padding: 18px;
        }

        .team-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
        }

        .team {
            padding: 15px;
            border-radius: 12px;
            background: #f7f8fa;
        }

        .team:last-child {
            text-align: right;
        }

        .team-name {
            font-size: 17px;
            font-weight: 800;
        }

        .team-score {
            margin-top: 7px;
            font-size: 20px;
            font-weight: 800;
        }

        .vs {
            font-size: 13px;
            font-weight: 700;
            color: #8a929b;
        }

        .match-status {
            margin-top: 15px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fff4f4;
            color: #c62828;
            font-weight: 700;
            font-size: 13px;
        }

        .empty {
            background: #ffffff;
            border: 1px solid #e7eaee;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .bottom-nav {
            max-width: 1150px;
            margin: 30px auto 0;
            padding: 18px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .bottom-nav a {
            color: #374151;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 650px) {
            .page {
                padding: 18px 12px 30px;
            }

            .team-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .team:last-child {
                text-align: left;
            }

            .vs {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            🏏 CRICMASTER
            <span>Live cricket, scores &amp; stats</span>
        </div>

        <div class="live-indicator">
            <span class="live-dot"></span>
            LIVE
        </div>
    </div>
</header>


<main class="page">

    <section class="hero">
        <h1>Live Matches</h1>
        <p>Follow matches that are currently in progress.</p>
    </section>


    <div class="toolbar">
        <a href="/index.html">Home</a>
        <a href="/pages/matches.html">All Matches</a>

        <button id="refreshBtn" class="refresh-btn">
            ↻ Refresh
        </button>
    </div>


    <div id="status">
        Loading live matches...
    </div>


    <section id="matchList" class="match-list"></section>

</main>


<nav class="bottom-nav">
    <a href="/index.html">Home</a>
    <a href="/pages/live.html">Live</a>
    <a href="/pages/matches.html">Matches</a>
    <a href="/pages/teams.html">Teams</a>
    <a href="/pages/stats.html">Stats</a>
    <a href="/pages/news.html">News</a>
</nav>


<script type="module" src="/js/live.js"></script>

</body>
</html>
