<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teams - CRICMASTER</title>

    <link
        rel="stylesheet"
        href="/css/reset.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #17202a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .topbar-inner {
            max-width: 1100px;
            margin: auto;
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 23px;
            font-weight: 800;
        }

        .page {
            max-width: 1100px;
            margin: auto;
            padding: 25px 18px 45px;
        }

        .heading h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
        }

        .heading p {
            margin: 7px 0 20px;
            color: #6b7280;
            font-size: 14px;
        }

        .status {
            margin-bottom: 15px;
            font-size: 13px;
            color: #6b7280;
        }

        .team-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .team-card {
            background: #ffffff;
            border: 1px solid #e3e7eb;
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }

        .team-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 7px 18px rgba(0, 0, 0, .06);
        }

        .team-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            margin-bottom: 13px;
        }

        .team-name {
            font-size: 16px;
            line-height: 1.35;
            font-weight: 800;
        }

        .team-link {
            margin-top: 7px;
            font-size: 12px;
            color: #6b7280;
        }

        .empty {
            background: #ffffff;
            border: 1px solid #e3e7eb;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        .nav {
            max-width: 1100px;
            margin: auto;
            padding: 18px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .nav a {
            text-decoration: none;
            color: #404851;
            font-size: 13px;
            font-weight: 700;
        }

        @media (max-width: 850px) {

            .team-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 550px) {

            .page {
                padding-left: 12px;
                padding-right: 12px;
            }

            .team-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<header class="topbar">

    <div class="topbar-inner">

        <div class="brand">
            🏏 CRICMASTER
        </div>

    </div>

</header>


<main class="page">

    <section class="heading">

        <h1>
            IPL Teams
        </h1>

        <p>
            Explore teams and their historical IPL records.
        </p>

    </section>


    <div
        id="status"
        class="status"
    >
        Loading teams...
    </div>


    <section
        id="teamList"
        class="team-grid"
    ></section>

</main>


<nav class="nav">

    <a href="/index.html">
        Home
    </a>

    <a href="/pages/live.html">
        Live
    </a>

    <a href="/pages/matches.html">
        Matches
    </a>

    <a href="/pages/players.html">
        Players
    </a>

    <a href="/pages/teams.html">
        Teams
    </a>

    <a href="/pages/stats.html">
        Stats
    </a>

    <a href="/pages/news.html">
        News
    </a>

</nav>


<script
    type="module"
    src="/js/teams.js"
></script>

</body>

</html>
