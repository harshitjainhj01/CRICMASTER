<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team Profile - CRICMASTER</title>

    <link
        rel="stylesheet"
        href="/css/reset.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            color: #17202a;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .topbar-inner {
            max-width: 1100px;
            margin: auto;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            border: 1px solid #dfe3e8;
            background: #ffffff;
            border-radius: 8px;
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
        }

        .page {
            max-width: 1100px;
            margin: auto;
            padding: 24px 18px 45px;
        }

        .status {
            margin-bottom: 15px;
            color: #6b7280;
            font-size: 13px;
        }

        .team-card {
            background: #ffffff;
            border: 1px solid #e3e7eb;
            border-radius: 16px;
            padding: 22px;
        }

        .team-icon {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 14px;
        }

        .team-name {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
        }

        .team-subtitle {
            margin-top: 7px;
            color: #6b7280;
            font-size: 13px;
        }

        .stats-grid {
            margin-top: 21px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .stat {
            background: #f7f8fa;
            border-radius: 12px;
            padding: 15px;
        }

        .stat-label {
            color: #737b85;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .stat-value {
            margin-top: 6px;
            font-size: 22px;
            font-weight: 800;
        }

        .section {
            margin-top: 18px;
            background: #ffffff;
            border: 1px solid #e3e7eb;
            border-radius: 16px;
            overflow: hidden;
        }

        .section-title {
            padding: 15px 18px;
            border-bottom: 1px solid #edf0f2;
            font-size: 17px;
            font-weight: 800;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 560px;
            border-collapse: collapse;
        }

        th {
            padding: 12px 14px;
            background: #f8f9fa;
            color: #737b85;
            font-size: 11px;
            text-transform: uppercase;
            text-align: right;
        }

        th:first-child {
            text-align: left;
        }

        td {
            padding: 12px 14px;
            border-top: 1px solid #edf0f2;
            font-size: 13px;
            text-align: right;
        }

        td:first-child {
            text-align: left;
            font-weight: 700;
        }

        .players {
            padding: 15px 18px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player {
            padding: 9px 11px;
            border-radius: 8px;
            background: #f4f6f8;
            font-size: 12px;
            font-weight: 600;
        }

        .empty {
            background: #ffffff;
            border: 1px solid #e3e7eb;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            color: #6b7280;
        }

        .nav {
            max-width: 1100px;
            margin: auto;
            padding: 18px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .nav a {
            text-decoration: none;
            color: #404850;
            font-size: 13px;
            font-weight: 700;
        }

        @media (max-width: 800px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 520px) {

            .page {
                padding: 18px 12px 35px;
            }

            .team-name {
                font-size: 25px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

        }
.team-matches {
    padding: 15px 18px 20px;
    display: grid;
    gap: 10px;
}

.team-match-card {
    background: #f8f9fa;
    border: 1px solid #e5e8eb;
    border-radius: 11px;
    padding: 14px;
    cursor: pointer;
    transition: transform .15s ease,
                box-shadow .15s ease;
}

.team-match-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, .05);
}

.team-match-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}

.team-match-title {
    font-size: 14px;
    font-weight: 800;
}

.team-match-result {
    font-size: 11px;
    font-weight: 800;
    padding: 5px 8px;
    border-radius: 6px;
    background: #e9eef2;
}

.team-match-result.won {
    color: #176b2c;
    background: #edf8ef;
}

.team-match-result.lost {
    color: #a52828;
    background: #fff0f0;
}

.team-match-result.no-result {
    color: #7a5c00;
    background: #fff8dc;
}

.team-match-meta {
    margin-top: 7px;
    font-size: 12px;
    color: #6b7280;
}

.team-match-venue {
    margin-top: 5px;
    font-size: 11px;
    color: #7a828b;
}
    </style>

</head>


<body>

<header class="topbar">

    <div class="topbar-inner">

        <button
            id="backBtn"
            class="back-btn"
            type="button"
        >
            ← Back
        </button>

        <div class="brand">
            🏏 CRICMASTER
        </div>

    </div>

</header>


<main class="page">

    <div
        id="status"
        class="status"
    >
        Loading team...
    </div>

    <div id="teamContainer"></div>

</main>


<nav class="nav">

    <a href="/index.html">
        Home
    </a>

    <a href="/pages/live.html">
        Live
    </a>

    <a href="/pages/matches.html">
        Matches
    </a>

    <a href="/pages/players.html">
        Players
    </a>

    <a href="/pages/teams.html">
        Teams
    </a>

    <a href="/pages/stats.html">
        Stats
    </a>

    <a href="/pages/news.html">
        News
    </a>

</nav>


<script
    type="module"
    src="/js/team-details.js"
></script>

</body>

</html>
